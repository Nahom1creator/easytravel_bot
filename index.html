<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyRide - Addis Ababa Travel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f6f9);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: var(--tg-theme-secondary-bg-color, white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { color: #00853f; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #00853f;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #006c32; }
    </style>
</head>
<body>

    <div class="container">
        <h2>EasyRide Booking</h2>
        
        <label for="pickup">Pickup Location:</label>
        <select id="pickup">
            <option value="Arat Killo">Arat Killo</option>
            <option value="Bole">Bole</option>
            <option value="Piazza">Piazza</option>
            <option value="Megenagna">Megenagna</option>
        </select>

        <label for="destination">Destination:</label>
        <select id="destination">
            <option value="Bole Airport">Bole Airport</option>
            <option value="CMC">CMC</option>
            <option value="Sarbet">Sarbet</option>
            <option value="Kazanchis">Kazanchis</option>
        </select>

        <button onclick="bookRide()">Book & Pay with Telebirr</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function bookRide() {
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;
            
            const bookingData = {
                pickup: pickup,
                destination: destination
            };

            // Sends the data back to your Telegram bot and closes the mini app
            tg.sendData(JSON.stringify(bookingData));
        }
    </script>
</body>
</html>
